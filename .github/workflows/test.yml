name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: node --test
  # The one check `main` requires by name. It needs every matrix leg, so a red leg blocks
  # the merge, and the privacy gate runs here once rather than once per Node version.
  test:
    needs: node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: privacy gate
        run: |
          hits=$(grep -rniE "onedrive|/Users/[a-z]|C:\\\\Users" --exclude-dir=.git --exclude=.git --exclude-dir=.github --exclude=measure.mjs . | grep -v "/Users/jane" || true)
          if [ -n "$hits" ]; then echo "$hits"; exit 1; fi
